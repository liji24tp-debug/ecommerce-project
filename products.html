<!doctype html>
<html lang="en">
  <head>

    <title>Musical Album Museum | Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Musical Album Museum</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
