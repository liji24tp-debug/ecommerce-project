<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteStage | EchoPlay</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">NoteStage</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">EchoPlay</a></li>
        <li><a href="cart.html">Collection</a></li>
      </ul>
    </nav>

    <header class="EchoPlay-header">
      <h1>ScoreMarket</h1>
      <p>The heartbeat of musicals, all in one place.</p>
    </header>

    <main class="product-grid">
      <div class="product-item">
        <img src="img/album1.png" alt="Les Misérables" />
        <p class="price">$25.00</p>
        <button
          class="fav-btn"
          data-id="Les Misérables"
          data-img="img/album1.png"
          onclick="toggleFavorite(this, 'Les Misérables')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <img src="img/album2.png" alt="Six" />
        <p class="price">$22.00</p>
        <button
          class="fav-btn"
          data-id="Six"
          data-img="img/album2.png"
          onclick="toggleFavorite(this, 'Six')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <a href="product.html">
          <img src="img/album3.png" alt="Hamilton" />
        </a>
        <p class="price">$29.99</p>
        <button
          class="fav-btn"
          data-id="Hamilton"
          data-img="img/album3.png"
          onclick="toggleFavorite(this, 'Hamilton')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <img src="img/album4.png" alt="Wicked" />
        <p class="price">$26.50</p>
        <button
          class="fav-btn"
          data-id="Wicked"
          data-img="img/album4.png"
          onclick="toggleFavorite(this, 'Wicked')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <img src="img/album5.png" alt="The Greatest Showman" />
        <p class="price">$20.00</p>
        <button
          class="fav-btn"
          data-id="The Greatest Showman"
          data-img="img/album5.png"
          onclick="toggleFavorite(this, 'The Greatest Showman')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <img src="img/album6.png" alt="Cats" />
        <p class="price">$18.00</p>
        <button
          class="fav-btn"
          data-id="Cats"
          data-img="img/album6.png"
          onclick="toggleFavorite(this, 'Cats')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <img src="img/album7.png" alt="LaLa Land" />
        <p class="price">$24.00</p>
        <button
          class="fav-btn"
          data-id="LaLa Land"
          data-img="img/album7.png"
          onclick="toggleFavorite(this, 'LaLa Land')"
        >
          ❤
        </button>
      </div>

      <div class="product-item">
        <img src="img/album8.png" alt="Rebecca" />
        <p class="price">$28.00</p>
        <button
          class="fav-btn"
          data-id="Rebecca"
          data-img="img/album8.png"
          onclick="toggleFavorite(this, 'Rebecca')"
        >
          ❤
        </button>
      </div>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
